# /etc/nginx/sites-available/conectorcaixa  (troque caixa.seudominio.com.br)
# HTTPS: sudo certbot --nginx -d caixa.seudominio.com.br
server {
    listen 80;
    server_name caixa.seudominio.com.br;

    # Fotos do caixa chegam comprimidas (~300 KB); folga para a checagem da IA.
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s; # leitura das fotos pela IA pode levar alguns segundos
    }
}
